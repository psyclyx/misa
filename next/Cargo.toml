[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.91"

[workspace.dependencies]
misa-client = { path = "crates/misa-client" }
misa-proto = { path = "crates/misa-proto" }
misa-value = { path = "crates/misa-value" }
misa-reframe = { path = "crates/misa-reframe" }
misa-render = { path = "crates/misa-render" }
misa-style = { path = "crates/misa-style" }
misa-terminal-ui = { path = "crates/misa-terminal-ui" }
misa-terminal-runtime = { path = "crates/misa-terminal-runtime" }
misa-lines = { path = "crates/misa-lines" }
misa-syntax = { path = "crates/misa-syntax" }
misa-markdown = { path = "crates/misa-markdown" }
misa-linear = { path = "crates/misa-linear" }
misa-kernel = { path = "crates/misa-kernel" }
misa-session = { path = "crates/misa-session" }
misa-protocol = { path = "crates/misa-protocol" }
misa-transport = { path = "crates/misa-transport" }
misa-plugin = { path = "crates/misa-plugin" }

async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["form", "http1", "json", "multipart", "tokio", "tracing"] }
ciborium = "0.2"
crossterm = "0.29"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
iroh = "1.2"
# The plugin host: a component is the one thing here that needs a runtime of its own.
wasmtime = { version = "48", features = ["component-model"] }
# The fixture test's encoder — what `wasm-tools component new` is under the hood, so that no
# test needs a binary of its own.
wit-component = "0.259"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skia-safe = { version = "0.93", features = ["textlayout", "vulkan"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
unicode-segmentation = "1"
blake3 = "1"
base64 = "0.22"
# Local-time rendering: `local-offset` reads the system zone (no tz database) and
# computes the offset for the instant being formatted, DST included.
time = { version = "0.3", features = ["local-offset"] }

[profile.dev]
incremental = true

[profile.release]
lto = "thin"
codegen-units = 1
