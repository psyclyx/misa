[package]
name = "misa-skia"
description = "Production Skia window and PNG export host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
image = { workspace = true, features = ["jpeg", "gif", "webp"] }
misa-client.workspace = true
misa-kit = { path = "../misa-kit" }
misa-proto.workspace = true
misa-protocol.workspace = true
misa-render.workspace = true
misa-style.workspace = true
misa-skia-ui = { path = "../misa-skia-ui" }
misa-skia-paint = { path = "../misa-skia-paint" }
misa-skia-vulkan = { path = "../misa-skia-vulkan", features = ["window"] }
misa-window-core = { path = "../misa-window-core" }
misa-transport.workspace = true
misa-value.workspace = true
serde_json.workspace = true
raw-window-handle = "0.6"
tokio.workspace = true
winit = "0.30.13"

[target.'cfg(unix)'.dependencies]
misa-local-start = { path = "../misa-local-start" }
