<!doctype html>
<html>
  <body>
    <script src="../src/app.js"></script>
    <script src="../src/request.js"></script>
    <script src="../src/commands.js"></script>
    <script src="../src/overview.js"></script>
    <script>
      (async function () {
        const checks = [];
        function assert(value, name) {
          if (!value) throw new Error(name);
          checks.push(name);
        }
        function storage() {
          const values = new Map();
          return {
            getItem: (key) => values.get(key) || null,
            setItem: (key, value) => values.set(key, value),
          };
        }
        const store = storage();
        try {
          const first = MisaClient.memory(store, "one");
          first.state.draft = "half a thought";
          first.state.theme = "plain";
          first.state.opened = ["call"];
          first.save();
          assert(
            MisaClient.memory(store, "one").state.draft === "half a thought",
            "draft survives reload",
          );
          assert(
            MisaClient.memory(store, "two").state.draft === "",
            "session memories stay separate",
          );
          store.setItem("broken", "{not json");
          assert(
            MisaClient.memory(store, "broken").state.theme === "system",
            "corrupt storage defaults",
          );
          store.setItem("shape", '{"opened":{},"draft":4,"theme":"bogus"}');
          assert(
            MisaClient.memory(store, "shape").state.opened.length === 0,
            "invalid field types default",
          );
          const unavailable = {
            getItem() {
              throw Error("denied");
            },
            setItem() {
              throw Error("full");
            },
          };
          const temporary = MisaClient.memory(unavailable, "one");
          temporary.state.draft = "still usable";
          temporary.save();
          assert(
            temporary.state.draft === "still usable",
            "storage denial preserves in-memory editing",
          );

          const frame = document.createElement("iframe");
          document.body.appendChild(frame);
          const doc = frame.contentDocument;
          const privateDoc = document.implementation.createHTMLDocument("request");
          privateDoc.body.innerHTML = '<p id="request-status"></p><form id="private-request"><input type="hidden" name="id" value="test"><input type="hidden" name="generation" value="1"><input type="password" name="value" value="private-key"><button>Respond</button></form>';
          let privateEvents;
          MisaRequest.start(privateDoc, function (url) { privateEvents = this; this.close = function () { this.closed = true; }; this.url = url; });
          privateEvents.onmessage({ data: "current" });
          assert(privateDoc.querySelector('[name="value"]').value === "private-key", "current private request retains its local secret draft");
          privateEvents.onmessage({ data: "resolved" });
          assert(privateDoc.querySelector('[name="value"]').value === "" && privateDoc.querySelector("button").disabled && privateEvents.closed, "remote request resolution clears secrets and disables the obsolete form");
          doc.body.dataset.session = "demo";
          const region =
            '<form id="composer"><textarea name="prompt"></textarea><button>Send</button></form>' +
            '<details id="call"><summary>Tool</summary><p>result</p></details>';
          doc.body.innerHTML =
            '<select id="theme"><option>system</option><option>dark</option><option>plain</option></select><main id="main">' +
            region +
            "</main>";
          const browser = {
            localStorage: store,
            scrollY: 0,
            innerHeight: 800,
            scrollTo() {},
          };
          const client = MisaClient.start(doc, browser);
          let draft = doc.querySelector("textarea");
          draft.value = "unsent";
          draft.dispatchEvent(new Event("input", { bubbles: true }));
          draft.focus();
          draft.setSelectionRange(2, 4);
          client.changes([
            {
              op: "insert",
              parent: "call",
              before: null,
              html: '<p id="added">new result</p>',
            },
          ]);
          assert(
            doc.querySelector("textarea") === draft &&
              doc.activeElement === draft,
            "an unrelated operation preserves the actual focused element",
          );
          assert(
            draft.selectionStart === 2 && draft.selectionEnd === 4,
            "an unrelated operation preserves selection",
          );
          const unchanged = doc.getElementById("call");
          client.changes([
            {
              op: "insert",
              parent: "call",
              before: "added",
              html: '<p id="earlier">earlier</p>',
            },
            {
              op: "replace",
              id: "added",
              html: '<p id="added">settled result</p>',
            },
          ]);
          assert(
            doc.getElementById("earlier").nextElementSibling.id === "added",
            "insert respects its sibling anchor",
          );
          assert(
            doc.getElementById("added").textContent === "settled result" &&
              doc.getElementById("call") === unchanged,
            "replacement keeps the parent DOM element",
          );
          client.changes([{ op: "remove", id: "earlier" }]);
          assert(!doc.getElementById("earlier"), "remove deletes its target");
          client.streams([{ id: "answer", role: "assistant", text: "é" }]);
          const streamNode = doc.querySelector('[data-stream="answer"]');
          const streamText = streamNode.firstChild;
          client.streamUpdate({
            update: "append",
            id: "answer",
            offset: 2,
            text: "🙂",
          });
          assert(
            streamNode.textContent === "é🙂" &&
              streamNode.firstChild === streamText,
            "stream appends use byte offsets and preserve the text node",
          );
          let rejected = false;
          try {
            client.streamUpdate({
              update: "append",
              id: "answer",
              offset: 3,
              text: "gap",
            });
          } catch (_) {
            rejected = true;
          }
          assert(
            rejected && streamNode.textContent === "é🙂",
            "gapped append is rejected",
          );
          client.snapshot(region);
          assert(
            doc.querySelector('[data-stream="answer"]') === streamNode,
            "canonical snapshot preserves the separate stream",
          );
          client.streamUpdate({ update: "end", id: "answer" });
          assert(
            !doc.querySelector('[data-stream="answer"]'),
            "settled stream is removed",
          );
          client.streams([{ id: "msg.7.text", role: "assistant", text: "done" }]);
          const settling = doc.querySelector('[data-stream="msg.7.text"]');
          assert(!settling.hidden, "unsettled stream is visible");
          client.snapshot(region + '<p id="msg.7">done</p>');
          assert(settling.hidden, "canonical owner hides its overlay before End arrives");
          client.streamUpdate({ update: "end", id: "msg.7.text" });
          client.snapshot(region);
          draft = doc.querySelector("textarea");
          client.streams([{ id: "atomic.text", role: "assistant", text: "done" }]);
          const main = doc.getElementById("main");
          let partial = false;
          const observer = new MutationObserver(function () {
            if (doc.getElementById("atomic") && doc.querySelector('[data-stream="atomic.text"]')) partial = true;
          });
          observer.observe(main, { subtree: true, childList: true });
          client.transaction([
            { kind: "changes", data: JSON.stringify([{ op: "insert", parent: "main", before: null, html: '<p id="atomic">done</p>' }]) },
            { kind: "stream", data: JSON.stringify({ update: "end", id: "atomic.text" }) },
          ]);
          await Promise.resolve();
          observer.disconnect();
          assert(!partial && doc.getElementById("atomic") && !doc.querySelector('[data-stream="atomic.text"]'), "DOM observers see complete settlement transactions");
          let invalid = false;
          try {
            client.transaction([{ kind: "changes", data: JSON.stringify([{ op: "remove", id: "missing" }]) }]);
          } catch (_) { invalid = true; }
          assert(invalid && main.hidden, "invalid derived DOM is hidden during recovery");
          const activity = doc.createElement("section"); activity.id = "activity"; doc.body.appendChild(activity);
          client.transaction([{ kind: "activity", data: "<p>Approval needed</p>" }]);
          assert(main.hidden && activity.textContent === "Approval needed", "independent work summaries stay usable without repairing an invalid document");
          try { client.transaction([{ kind: "streams", data: "[]" }]); } catch (_) {}
          assert(main.hidden, "a delta cannot revive an invalid DOM");
          client.transaction([{ kind: "snapshot", data: region }, { kind: "streams", data: "[]" }]);
          assert(!main.hidden, "coherent replacement restores visibility");
          draft = doc.querySelector("textarea");
          assert(draft.value === "unsent", "snapshot preserves unsent draft");
          assert(
            doc.activeElement === draft &&
              draft.selectionStart === 2 &&
              draft.selectionEnd === 4,
            "snapshot preserves composer focus and selection",
          );
          let detail = doc.getElementById("call");
          detail.open = true;
          detail.dispatchEvent(new Event("toggle"));
          client.snapshot(region);
          assert(
            doc.getElementById("call").open,
            "snapshot preserves opened disclosure",
          );
          const theme = doc.getElementById("theme");
          theme.value = "plain";
          theme.dispatchEvent(new Event("change"));
          assert(
            doc.documentElement.dataset.theme === "plain",
            "theme is applied locally",
          );
          assert(
            MisaClient.memory(store, "misa.preferences.demo").state.theme ===
              "plain",
            "theme is persisted",
          );
          const form = doc.getElementById("composer");
          draft = doc.querySelector("textarea");
          form.action = "./intent";
          let reply;
          let calls = 0;
          browser.fetch = function () { calls++; return new Promise(function (resolve) { reply = resolve; }); };
          const submitted = function () { form.dispatchEvent(new Event("submit", { bubbles: true, cancelable: true })); };
          const settle = async function (ok, value) {
            reply({ ok: ok, json: async function () { return value; } });
            await new Promise(function (resolve) { setTimeout(resolve, 0); });
          };
          submitted();
          assert(draft.value === "unsent", "submission waits for acknowledgment before clearing");
          draft.value = "newer typing";
          draft.dispatchEvent(new Event("input", { bubbles: true }));
          await settle(true, { ok: true });
          assert(draft.value === "newer typing", "late acceptance preserves newer typing");
          assert(client.prefs.state.recoveries.length === 0, "confirmed acceptance releases recovery copy");
          submitted();
          submitted();
          assert(calls === 2, "duplicate submission while pending is suppressed");
          await settle(false, { ok: false, error: "Command rejected" });
          assert(draft.value === "newer typing" && client.prefs.state.recoveries[0].text === "newer typing", "rejection retains submitted text");
          assert(MisaClient.memory(store, "misa.preferences.demo").state.recoveries.length === 1, "recovery copy survives reload without replay");
          submitted();
          await settle(true, { ok: true, report: '<p id="local-report">Read-only report</p>' });
          assert(draft.value === "", "unchanged acknowledged draft clears");
          assert(doc.querySelector("dialog[open]") && doc.getElementById("local-report"), "read response opens a local report");
          doc.querySelector("dialog button").click();
          assert(!doc.querySelector("dialog") && calls === 3, "closing a report sends no domain command");
          draft.value = "uncertain submission";
          draft.dispatchEvent(new Event("input", { bubbles: true }));
          submitted();
          reply({ ok: true, json: async function () { throw Error("Reply lost"); } });
          await new Promise(function (resolve) { setTimeout(resolve, 0); });
          assert(draft.value === "uncertain submission" && calls === 4, "lost reply retains the draft and never retries the mutation");
          assert(client.prefs.state.recoveries.some(function (entry) { return entry.text === "uncertain submission" && entry.reason.includes("Check the session"); }), "uncertain submissions remain explicitly recoverable");
          doc.getElementById("main").innerHTML = "";
          const multi = function (documents) { client.transaction([{ kind: "documents", data: JSON.stringify(documents) }]); };
          const presentation = function (id, prefix, html) { return { id, prefix, messages: [
            { kind: "snapshot", data: html }, { kind: "streams", data: "[]" }
          ] }; };
          let mixedPublication = false;
          const composedObserver = new MutationObserver(function () {
            if (!!doc.getElementById("conversation-value") !== !!doc.getElementById("status:value")) mixedPublication = true;
          });
          composedObserver.observe(doc.getElementById("main"), { childList: true, subtree: true });
          multi([
            presentation("conversation", "", '<p id="conversation-value">Conversation</p>'),
            presentation("status", "status:", '<p id="status:value">Status</p>')
          ]);
          await Promise.resolve();
          assert(!mixedPublication && doc.getElementById("status:value"), "selected documents become visible in one publication");
          composedObserver.disconnect();
          multi(["conversation", "status"].map(function (id) { return {
            id, prefix: id === "status" ? "status:" : "", messages: [{ kind: "streams", data: JSON.stringify([{ id: "answer.text", role: "assistant", text: id }]) }]
          }; }));
          multi([{ id: "status", prefix: "status:", messages: [{ kind: "stream", data: JSON.stringify({ update: "append", id: "answer.text", offset: 6, text: " updated" }) }] }]);
          assert(doc.querySelector('[data-presentation="conversation"] pre').textContent === "conversation", "same stream identity in another document stays independent");
          assert(doc.querySelector('[data-presentation="status"] pre').textContent === "status updated", "document stream append targets its own live state");
          let multiFailed = false;
          try { multi([{ id: "status", prefix: "status:", messages: [{ kind: "changes", data: '[{"op":"remove","id":"missing"}]' }] }]); } catch (_) { multiFailed = true; }
          assert(multiFailed && doc.getElementById("main").hidden, "invalid selected document hides the complete composition");
          let partialRepair = false;
          try { multi([presentation("status", "status:", '<p id="status:value">Partial</p>')]); } catch (_) { partialRepair = true; }
          assert(partialRepair && doc.getElementById("main").hidden, "one document replacement cannot revive an invalid composition");
          multi([presentation("conversation", "", '<p id="conversation-value">Recovered</p>'), presentation("status", "status:", '<p id="status:value">Current</p>')]);
          assert(!doc.getElementById("main").hidden, "complete replacement repairs the selected composition");
          client.transaction([
            { kind: "selection", data: '["conversation"]' },
            { kind: "documents", data: JSON.stringify([presentation("conversation", "", '<p id="conversation-value">Still selected</p>')]) }
          ]);
          assert(!doc.querySelector('[data-presentation="status"]') && doc.getElementById("conversation-value").textContent === "Still selected", "selection replacement removes only deselected documents");
          const actionFrame = document.createElement("iframe"); document.body.appendChild(actionFrame);
          const actionDoc = actionFrame.contentDocument;
          actionDoc.body.innerHTML = '<main id="main"></main><dialog open><form action="./perform"><input name="action_id" value="pet.feed" type="hidden"><input name="field.quantity" value="wrong"><button>Feed</button></form></dialog>';
          let actionAccepted = false, actionCalls = 0;
          MisaClient.start(actionDoc, { localStorage: storage(), scrollY: 0, innerHeight: 800, scrollTo() {}, fetch: async function () {
            actionCalls++; return { ok: actionAccepted, json: async function () { return actionAccepted ? { ok: true, outcome: { status: "completed", value: null } } : { ok: false, error: "Enter a number" }; } };
          } });
          const actionForm = actionDoc.querySelector("form");
          actionForm.dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
          await new Promise(function (resolve) { setTimeout(resolve, 0); });
          assert(actionDoc.querySelector("dialog") && actionForm.elements["field.quantity"].value === "wrong", "rejected generic forms retain their local fields for correction");
          actionForm.elements["field.quantity"].value = "3"; actionAccepted = true;
          actionForm.dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
          await new Promise(function (resolve) { setTimeout(resolve, 0); });
          assert(!actionDoc.querySelector("dialog") && actionCalls === 2, "confirmed generic action closes only its local form");
          const searchFrame = document.createElement("iframe"); document.body.appendChild(searchFrame);
          const searchDoc = searchFrame.contentDocument;
          searchDoc.body.innerHTML = '<input data-source="providers" list="provider-choices" aria-describedby="provider-status"><datalist id="provider-choices"></datalist><small id="provider-status"></small>';
          const searches = [];
          MisaCommands.start(searchDoc, { fetch: function (url) { return new Promise(function (resolve) { searches.push({ url, resolve }); }); } });
          const searchField = searchDoc.querySelector("input");
          searchField.value = "g"; searchField.dispatchEvent(new Event("input", { bubbles: true }));
          await new Promise(function (resolve) { setTimeout(resolve, 150); });
          searchField.value = "gr"; searchField.dispatchEvent(new Event("input", { bubbles: true }));
          await new Promise(function (resolve) { setTimeout(resolve, 150); });
          assert(searches.length === 2 && searches[1].url.includes("q=gr"), "completion reads the command field's current text");
          searches[1].resolve({ ok: true, json: async function () { return { items: [{ value: "groq", label: "Groq" }], truncated: false }; } });
          await new Promise(function (resolve) { setTimeout(resolve, 0); });
          searches[0].resolve({ ok: true, json: async function () { return { items: [{ value: "obsolete", label: "Obsolete" }], truncated: true }; } });
          await new Promise(function (resolve) { setTimeout(resolve, 0); });
          assert(searchDoc.querySelector("option").value === "groq" && searchField.value === "gr", "late completion cannot replace newer choices or edit the field");
          const prepareFrame = document.createElement("iframe"); document.body.appendChild(prepareFrame);
          const prepareDoc = prepareFrame.contentDocument;
          prepareDoc.body.innerHTML = '<main id="main"><form id="composer" action="./intent"><input type="hidden" name="action" value="composer.submit"><textarea name="prompt"></textarea><button>Send</button></form></main>';
          let preparationCalls = 0, invocationCalls = 0;
          const prepareClient = MisaClient.start(prepareDoc, { localStorage: storage(), scrollY: 0, innerHeight: 800, scrollTo() {}, fetch: async function (url) {
            if (url.endsWith("/perform")) { invocationCalls++; return { ok: true, json: async function () { return { ok: true }; } }; }
            preparationCalls++; return { ok: true, json: async function () { return { ok: true, preparation: true, report: '<form action="./perform"><input name="field.model" value="chosen"><button>Select</button></form>' }; } };
          } });
          const prepareComposer = prepareDoc.querySelector("textarea");
          prepareComposer.value = "/model"; prepareComposer.dispatchEvent(new Event("input", { bubbles: true }));
          prepareDoc.querySelector("#composer").dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
          await new Promise(function (resolve) { setTimeout(resolve, 0); });
          assert(prepareComposer.value === "/model" && invocationCalls === 0 && prepareClient.prefs.state.recoveries.length === 0, "opening command preparation preserves the composer without claiming a pending invocation");
          prepareComposer.value = "newer thought"; prepareComposer.dispatchEvent(new Event("input", { bubbles: true }));
          prepareDoc.querySelector("dialog form").dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
          await new Promise(function (resolve) { setTimeout(resolve, 0); });
          assert(invocationCalls === 1 && preparationCalls === 1 && prepareComposer.value === "newer thought" && !prepareDoc.querySelector("dialog"), "choosing a prepared command preserves newer composer input");
          const prefFrame = document.createElement("iframe");
          document.body.appendChild(prefFrame);
          const prefDoc = prefFrame.contentDocument;
          prefDoc.body.dataset.session = "new-runtime:new-instance";
          prefDoc.body.dataset.preferences = "daemon:session";
          prefDoc.body.innerHTML = '<main id="main"></main><form data-presentation-choice action="./presentations"><input name="id" value="status"><select name="choice"><option value="auto">Auto</option><option value="hide">Hidden</option></select><button>Apply</button></form>';
          store.setItem("misa.presentations.daemon:session", '{"status":"hide"}');
          let preferenceCalls = 0, preferenceAccepted = true;
          MisaClient.start(prefDoc, { localStorage: store, scrollY: 0, innerHeight: 800, scrollTo() {}, fetch: async function () {
            preferenceCalls++; return { ok: preferenceAccepted, json: async function () { return { ok: preferenceAccepted, error: "Unavailable" }; } };
          } });
          await new Promise(function (resolve) { setTimeout(resolve, 0); });
          const prefForm = prefDoc.querySelector("form");
          assert(prefForm.elements.choice.value === "hide" && preferenceCalls === 1, "saved choices restore across runtime and instance changes");
          prefForm.elements.choice.value = "auto";
          prefForm.dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
          prefForm.dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
          await new Promise(function (resolve) { setTimeout(resolve, 0); });
          assert(preferenceCalls === 2 && JSON.parse(store.getItem("misa.presentations.daemon:session")).status === "auto", "only acknowledged choices persist and pending duplicate changes are suppressed");
          preferenceAccepted = false;
          prefForm.elements.choice.value = "hide";
          prefForm.dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
          await new Promise(function (resolve) { setTimeout(resolve, 0); });
          assert(prefForm.elements.choice.value === "auto" && JSON.parse(store.getItem("misa.presentations.daemon:session")).status === "auto", "failed changes retain confirmed preference and control state");
          const copyFrame = document.createElement("iframe");
          document.body.appendChild(copyFrame);
          const copyDoc = copyFrame.contentDocument;
          copyDoc.body.dataset.session = "old-instance";
          copyDoc.body.innerHTML = '<main id="main"><form id="composer"><textarea name="prompt"></textarea></form></main>';
          store.setItem("misa.preferences.old-instance", '{"draft":"copied thought"}');
          let claimReply, copiedLocation;
          MisaClient.start(copyDoc, { localStorage: store, location: { pathname: "/view/original/", replace(value) { copiedLocation = value; } }, fetch() {
            return new Promise(function (resolve) { claimReply = resolve; });
          } });
          assert(copyDoc.body.inert, "copied tab cannot interact before acquiring its own presentation");
          claimReply({ ok: true, json: async function () { return { url: "/view/copy/", memory: "new-instance" }; } });
          await new Promise(function (resolve) { setTimeout(resolve, 0); });
          assert(copiedLocation === "/view/copy/" && JSON.parse(store.getItem("misa.preferences.new-instance")).draft === "copied thought", "copied tab redirects to independent instance and carries initial draft");
          store.setItem("misa.preferences.new-instance", '{"draft":"independent edit"}');
          assert(JSON.parse(store.getItem("misa.preferences.old-instance")).draft === "copied thought", "copied draft does not share future mutations");
          const overviewDoc = document.implementation.createHTMLDocument("overview");
          overviewDoc.body.innerHTML = '<input id="local-draft" value="new session name"><p id="overview-status"></p><div id="overview"></div>';
          let overviewEvents;
          MisaOverview.start(overviewDoc, function () { overviewEvents = this; });
          overviewEvents.onmessage({data: '<button>Working · awaiting input</button>'});
          overviewEvents.onerror();
          assert(overviewDoc.querySelector("button").disabled && overviewDoc.getElementById("overview-status").textContent.includes("stale"), "overview loss marks cached summaries stale and disables old navigation");
          overviewEvents.onmessage({data: '<button>Idle</button>'});
          assert(!overviewDoc.querySelector("button").disabled && overviewDoc.getElementById("local-draft").value === "new session name", "coherent overview replacement preserves local lifecycle drafts");
          const closeDoc = document.implementation.createHTMLDocument("close");
          closeDoc.body.innerHTML = '<main id="main">' + region + '</main>';
          const closeClient = MisaClient.start(closeDoc, browser);
          closeDoc.querySelector("textarea").value = "retained thought";
          closeClient.transaction([{kind: "closed", data: "Presentation closed; session work continues"}]);
          assert(closeDoc.querySelector("textarea").disabled, "closed presentation disables mutation controls");
          assert(closeDoc.querySelector("textarea").value === "retained thought", "closing preserves the local draft");
          closeClient.transaction([{kind: "snapshot", data: "late replacement"}]);
          assert(closeDoc.querySelector("textarea").value === "retained thought", "late publications cannot revive a closed presentation");
          document.body.dataset.result = "passed";
          document.body.append(checks.length + " browser checks passed");
        } catch (error) {
          document.body.dataset.result = "failed";
          document.body.append(error.stack);
        }
      })();
    </script>
  </body>
</html>
