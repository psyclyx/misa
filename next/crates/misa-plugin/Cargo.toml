[package]
name = "misa-plugin"
description = "The wasm plugin host: a component as handlers the loop can run"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
misa-proto.workspace = true
misa-reframe.workspace = true
misa-value.workspace = true
serde_json.workspace = true
wasmtime.workspace = true

[dev-dependencies]
misa-client.workspace = true
misa-protocol.workspace = true
# The fixture test encodes `wit/guest`'s module into a component in process, which is the
# same thing `wasm-tools component new` does — so the test needs no binary of its own.
wit-component.workspace = true
# And one test runs a plugin inside a *session*, because that is where a plugin is meant to
# live: the host is below the session in the dependency order, so this is a test's business and
# not the crate's.
misa-kernel.workspace = true
misa-session.workspace = true
# A client-side crate, and only for tests: the block for a tree is what a person sees in every
# frontend, and a test that asserts on it is asserting on the thing itself rather than on a
# second rendering of it that could disagree.
misa-render.workspace = true
# A session is a runtime: starting one spawns the tasks that carry kernel reports back.
tokio.workspace = true

[features]
# The integration test that needs a *component*: it builds `wit/guest` for
# `wasm32-unknown-unknown`, which needs a rustc with that target — the shell has one, and a
# plain `cargo test --workspace` must not start a nested cargo build. This is the same
# bargain `misa-skia`'s `paint` feature makes.
guest-fixture = []
