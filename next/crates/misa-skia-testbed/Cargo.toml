[package]
name = "misa-skia-testbed"
description = "Offline headless Skia fixture and raster benchmarks (optional native window)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
native = ["dep:winit", "dep:raw-window-handle", "misa-skia-vulkan/window"]

[dependencies]
image.workspace = true
misa-skia-ui = { path = "../misa-skia-ui" }
misa-skia-paint = { path = "../misa-skia-paint" }
misa-window-core = { path = "../misa-window-core" }
misa-proto.workspace = true
misa-render.workspace = true
misa-value.workspace = true
misa-skia-vulkan = { path = "../misa-skia-vulkan" }
raw-window-handle = { version = "0.6", optional = true }
winit = { version = "0.30.13", optional = true }
