[package]
default-run = "misa"
name = "misa-tui"
description = "The terminal frontend: a renderer, an editor, a picker, and a key loop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
image.workspace = true
async-trait.workspace = true
base64.workspace = true
crossterm.workspace = true
misa-client = { path = "../misa-client" }
misa-net.workspace = true
misa-proto.workspace = true
misa-render.workspace = true
misa-value.workspace = true
tokio.workspace = true

[[bin]]
name = "misa"
path = "src/main.rs"

[[bin]]
name = "misa-tui"
path = "src/alias.rs"

[dev-dependencies]
misa-session.workspace = true
misa-kernel.workspace = true
