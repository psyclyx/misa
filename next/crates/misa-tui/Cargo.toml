[package]
default-run = "misa"
name = "misa-tui"
description = "The terminal frontend: a renderer, an editor, a picker, and a key loop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }
image.workspace = true
async-trait.workspace = true
crossterm.workspace = true
misa-kit = { path = "../misa-kit" }
misa-linear.workspace = true
misa-client.workspace = true
misa-protocol.workspace = true
misa-transport.workspace = true
misa-tui-app = { path = "../misa-tui-app" }
misa-proto.workspace = true
misa-render.workspace = true
misa-lines.workspace = true
misa-terminal-ui.workspace = true
misa-terminal-runtime.workspace = true
misa-value.workspace = true
tokio.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
misa-local-start = { path = "../misa-local-start" }

[[bin]]
name = "misa"
path = "src/main.rs"

[[bin]]
name = "misa-tui"
path = "src/alias.rs"

[dev-dependencies]
iroh.workspace = true
misa-daemon = { path = "../misa-daemon" }
misa-session.workspace = true
misa-kernel.workspace = true
