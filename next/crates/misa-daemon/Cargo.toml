[package]
name = "misa-daemon"
description = "A daemon: a kernel, the sessions composed over it, and an iroh endpoint"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Offline scripted behavior is a fixture capability, not part of the shipped
# daemon's provider/runtime surface.
fixtures = []

[dependencies]
blake3.workspace = true
serde.workspace = true
ciborium.workspace = true
getrandom = "0.4"
# The pairing code, drawn for a camera. An encoder rather than a link to one: a daemon that
# cannot show a code without reaching the network is a daemon that cannot be paired offline.
qrcode = { version = "0.14", default-features = false }
misa-kernel.workspace = true
misa-transport.workspace = true
misa-proto.workspace = true
misa-protocol.workspace = true
misa-plugin.workspace = true
misa-session.workspace = true
misa-value.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
