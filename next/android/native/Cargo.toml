[package]
name = "misa-android"
version = "0.1.0"
edition = "2024"
publish = false

# A workspace of its own, like every JNI crate here: the Android library links the
# client half of the protocol and must not drag the whole desktop workspace's
# feature unification into a phone build.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
misa-client = { path = "../../crates/misa-client" }
misa-kit = { path = "../../crates/misa-kit" }
jni = "0.21"
misa-transport = { path = "../../crates/misa-transport" }
misa-proto = { path = "../../crates/misa-proto" }
misa-protocol = { path = "../../crates/misa-protocol" }
misa-value = { path = "../../crates/misa-value" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
iroh = "1.2"
blake3 = "1"
