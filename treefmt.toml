tree-root-file = "build.zig.zon"
walk = "filesystem"
excludes = [
  ".direnv/*",
  ".zig-cache/*",
  "docs/catalogs.md",
  "docs/services.md",
  "npins/*",
  "zig-out/*",
]

[formatter.zig]
command = "zig"
options = ["fmt"]
includes = ["*.zig"]

[formatter.nix]
command = "nixfmt"
includes = ["*.nix"]

[formatter.fennel]
command = "fnlfmt"
options = ["--fix"]
includes = [
  "benchmarks/**/*.fnl",
  "extensions/**/*.fnl",
  "src/lua_runtime/**/*.fnl",
  "tests/**/*.fnl",
  "tools/**/*.fnl",
]

# `docs/catalogs.md` and `docs/services.md` are generated by
# `tools/generate-docs.fnl` and compared byte-for-byte by the suite, so a
# formatter must not rewrite them; that exclusion is above.

[formatter.markdown]
command = "prettier"
options = ["--write"]
includes = ["*.md"]
