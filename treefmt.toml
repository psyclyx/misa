tree-root-file = "build.zig.zon"
walk = "filesystem"
excludes = [
  ".direnv/*",
  ".zig-cache/*",
  "docs/catalogs.md",
  "docs/services.md",
  "next/target/*",
  "next/wit/guest/target/*",
  "npins/*",
  "zig-out/*",
]

[formatter.zig]
command = "zig"
options = ["fmt"]
includes = ["*.zig"]

[formatter.nix]
command = "nixfmt"
includes = ["*.nix"]

# `next` is a nested Rust workspace with its own `treefmt.toml`, but the root
# configuration is the one the pre-commit hook runs. Without this entry a staged
# `.rs` file was silently skipped rather than checked.
[formatter.rustfmt]
command = "rustfmt"
options = ["--edition", "2024"]
includes = ["next/**/*.rs"]

[formatter.fennel]
command = "fnlfmt"
options = ["--fix"]
includes = [
  "benchmarks/**/*.fnl",
  "extensions/**/*.fnl",
  "src/lua_runtime/**/*.fnl",
  "tests/**/*.fnl",
  "tools/**/*.fnl",
]

# `docs/catalogs.md` and `docs/services.md` are generated by
# `tools/generate-docs.fnl` and compared byte-for-byte by the suite, so a
# formatter must not rewrite them; that exclusion is above.

[formatter.markdown]
command = "prettier"
options = ["--write"]
includes = ["*.md"]
